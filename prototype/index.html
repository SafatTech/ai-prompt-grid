<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Prompt Grid helps you discover tested prompts for transforming your own photos in external AI image editors.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315151E'/%3E%3Cg fill='%238B6CFF'%3E%3Crect x='6' y='6' width='5' height='5' rx='1'/%3E%3Crect x='14' y='6' width='5' height='5' rx='1'/%3E%3Crect x='22' y='6' width='5' height='5' rx='1'/%3E%3Crect x='6' y='14' width='5' height='5' rx='1'/%3E%3Crect x='14' y='14' width='5' height='5' rx='1'/%3E%3Crect x='22' y='14' width='5' height='5' rx='1'/%3E%3Crect x='6' y='22' width='5' height='5' rx='1'/%3E%3Crect x='14' y='22' width='5' height='5' rx='1'/%3E%3Crect x='22' y='22' width='5' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <title>AI Prompt Grid</title>
  <style>
    :root {
      --bg: #0B0B10;
      --surface: #15151E;
      --surface-2: #1D1D29;
      --text: #F5F3EE;
      --muted: #A6A4B2;
      --violet: #8B6CFF;
      --violet-dark: #7254E8;
      --peach: #FF9B82;
      --mint: #67D8B2;
      --danger: #FF7C8E;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.18);
      --shadow: 0 24px 70px rgba(0,0,0,.32);
      --radius: 18px;
      --pill: 999px;
      --max: 1380px;
      --header: 72px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 84% 0%, rgba(139,108,255,.09), transparent 27rem),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body.no-scroll { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, a, select, input[type="range"] { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    img {
      display: block; width: 100%; height: 100%; object-fit: cover;
      background: linear-gradient(145deg, #302B45, #1D1D29 48%, #292238);
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(139,108,255,.42);
      outline-offset: 3px;
    }

    .container { width: min(var(--max), calc(100% - 48px)); margin-inline: auto; }
    .view { min-height: calc(100dvh - var(--header)); animation: viewIn .35s ease both; }
    @keyframes viewIn { from { opacity: 0; } }
    .muted { color: var(--muted); }
    .accent { color: #A995FF; }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .site-header {
      position: sticky; top: 0; z-index: 30;
      height: var(--header);
      background: rgba(11,11,16,.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .nav {
      height: 100%; display: flex; align-items: center; gap: 24px;
    }
    .logo {
      display: inline-flex; align-items: center; gap: 11px; flex: 0 0 auto;
      border: 0; background: transparent; padding: 0; cursor: pointer;
      font-weight: 760; letter-spacing: -.02em; font-size: 17px;
    }
    .grid-mark {
      width: 25px; height: 25px; display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 2px; padding: 3px; border: 1px solid rgba(139,108,255,.45);
      border-radius: 7px; background: rgba(139,108,255,.12);
    }
    .grid-mark i { border-radius: 1.5px; background: var(--text); opacity: .82; }
    .grid-mark i:nth-child(2), .grid-mark i:nth-child(5), .grid-mark i:nth-child(9) { background: var(--violet); }
    .nav-links { display: flex; align-items: center; gap: 4px; margin-left: 20px; }
    .nav-link {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      padding: 9px 12px; border-radius: 10px; font-size: 14px; white-space: nowrap;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); background: rgba(255,255,255,.055); }
    .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .header-search {
      width: 230px; position: relative; display: flex; align-items: center;
    }
    .header-search input {
      width: 100%; height: 40px; padding: 0 38px 0 14px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--line); color: var(--text);
    }
    .header-search input::placeholder { color: #858391; }
    .header-search button {
      position: absolute; right: 5px; width: 31px; height: 31px; border: 0;
      background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer;
    }
    .btn {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      gap: 9px; padding: 0 18px; border: 1px solid transparent; border-radius: 12px;
      font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
      transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--violet); color: #100D1A; }
    .btn-primary:hover { background: #9B82FF; }
    .btn-secondary { background: var(--surface-2); border-color: var(--line); color: var(--text); }
    .btn-secondary:hover { background: #272636; border-color: var(--line-strong); }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
    .btn-ghost:hover { color: var(--text); border-color: var(--line-strong); }
    .btn-danger { background: rgba(255,124,142,.12); border-color: rgba(255,124,142,.25); color: #FFB4BE; }
    .icon-btn {
      width: 42px; height: 42px; display: inline-grid; place-items: center; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(21,21,30,.92); color: var(--text);
      cursor: pointer; font-size: 19px; transition: .2s ease;
    }
    .icon-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .icon-btn.saved { color: var(--peach); background: rgba(255,155,130,.12); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(139,108,255,.6);
      padding: 2px; cursor: pointer; background: linear-gradient(135deg, #6D52DE, #C18CFF);
      display: grid; place-items: center; font-weight: 800; color: #100D1A;
    }
    .profile-wrap { position: relative; }
    .profile-menu {
      position: absolute; right: 0; top: 50px; width: 210px; padding: 8px;
      border-radius: 14px; background: #1A1924; border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
    }
    .profile-menu p { margin: 6px 10px 10px; font-size: 12px; color: var(--muted); }
    .profile-menu button {
      width: 100%; padding: 10px; border: 0; background: transparent; color: var(--text);
      border-radius: 9px; text-align: left; cursor: pointer;
    }
    .profile-menu button:hover { background: rgba(255,255,255,.06); }
    .menu-toggle { display: none; }
    .mobile-drawer {
      position: fixed; z-index: 55; inset: var(--header) 0 auto 0;
      padding: 14px 18px 20px; background: #111118; border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .mobile-drawer button { width: 100%; justify-content: flex-start; margin-top: 7px; }

    .hero {
      min-height: min(750px, calc(100dvh - var(--header)));
      display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(42px, 7vw, 108px);
      align-items: center; padding: 66px 0; position: relative; isolation: isolate;
    }
    .hero::before {
      content: ""; position: absolute; z-index: 0; inset-block: 0; left: 50%;
      width: 100vw; transform: translateX(-50%); pointer-events: none;
      background:
        linear-gradient(90deg, rgba(11,11,16,.36), rgba(11,11,16,.1)),
        url("./hero-background5.png") 58% center / cover no-repeat;
      opacity: .28;
    }
    .hero > * { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-flex; align-items: center; min-height: 30px; padding: 0 11px;
      border-radius: var(--pill); background: rgba(139,108,255,.10);
      border: 1px solid rgba(139,108,255,.23); color: #C1B4FF;
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em;
    }
    .hero h1 {
      max-width: 670px; margin: 22px 0 20px; font-size: clamp(48px, 6.25vw, 88px);
      line-height: .95; letter-spacing: -.065em; font-weight: 780;
    }
    .hero h1 span { color: var(--muted); font-weight: 620; }
    .hero-copy > p {
      max-width: 610px; margin: 0; color: #C3C1CB; font-size: clamp(16px, 1.25vw, 19px);
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
    .hero-art {
      min-height: 530px; position: relative; isolation: isolate;
    }
    .hero-art::before {
      content: ""; position: absolute; inset: 10% 8%;
      border-radius: 50%; background: rgba(139,108,255,.12); filter: blur(70px); z-index: -1;
    }
    .mini-transform {
      position: absolute; width: min(360px, 61%); padding: 8px;
      border: 1px solid rgba(255,255,255,.13); border-radius: var(--radius);
      background: rgba(21,21,30,.94); box-shadow: 0 25px 70px rgba(0,0,0,.35);
      transition: transform .35s ease;
    }
    .mini-transform:hover { transform: translateY(-5px) rotate(0deg) !important; z-index: 5; }
    .mini-transform:nth-child(1) { top: 0; left: 2%; transform: rotate(-3deg); }
    .mini-transform:nth-child(2) { top: 14%; right: 0; transform: rotate(3deg); }
    .mini-transform:nth-child(3) { bottom: 10%; left: 0; transform: rotate(2deg); }
    .mini-transform:nth-child(4) { bottom: 0; right: 4%; transform: rotate(-2deg); }
    .mini-images {
      position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      height: 128px; overflow: hidden; border-radius: 12px;
    }
    .mini-images img { background: var(--surface-2); }
    .mini-arrow {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: var(--bg);
      display: grid; place-items: center; font-weight: 900; box-shadow: 0 5px 20px rgba(0,0,0,.3);
    }
    .mini-caption { display: flex; justify-content: space-between; gap: 8px; padding: 9px 5px 3px; font-size: 11px; }
    .mini-caption span:first-child { color: var(--muted); }
    .mini-caption span:last-child { color: #D6CDFF; font-weight: 700; }

    .section { padding: 88px 0; }
    .section-tight { padding: 64px 0; }
    .section-head { max-width: 760px; margin-bottom: 30px; }
    .section-head h2 {
      margin: 0 0 10px; font-size: clamp(32px, 4vw, 54px); line-height: 1.03;
      letter-spacing: -.045em;
    }
    .section-head p { margin: 0; color: var(--muted); font-size: 17px; }
    .section-title-row {
      display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px;
    }
    .section-title-row h2 { margin: 0; font-size: clamp(28px, 3vw, 42px); letter-spacing: -.035em; }
    .text-link {
      border: 0; background: transparent; color: #BBAEFF; font-weight: 700;
      cursor: pointer; padding: 7px 0;
    }
    .text-link:hover { color: var(--text); }
    .category-strip { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: thin; }
    .chip {
      min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--pill);
      color: #C8C6CF; background: var(--surface); cursor: pointer; white-space: nowrap; font-size: 13px;
    }
    .chip:hover, .chip.active { color: var(--text); border-color: rgba(139,108,255,.55); background: rgba(139,108,255,.14); }

    .style-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; align-items: start; }
    .style-card {
      position: relative; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--surface); cursor: pointer; transition: transform .28s ease, border-color .28s ease;
    }
    .style-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.2); }
    .style-card:nth-child(3n+2) { margin-top: 24px; }
    .card-media { height: var(--card-h, 330px); position: relative; overflow: hidden; background: #242331; }
    .compare { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: pan-y; }
    .compare-base, .compare-after { position: absolute; inset: 0; }
    .compare-after { clip-path: inset(0 0 0 50%); }
    .compare-after img, .compare-base img { background: linear-gradient(135deg, #292836, #15151e); }
    .compare-line {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
      background: rgba(245,243,238,.92); transform: translateX(-1px); pointer-events: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,.18);
    }
    .compare-handle {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 38px; height: 38px; border-radius: 50%; background: var(--text); color: #17151e;
      display: grid; place-items: center; font-size: 12px; font-weight: 900; pointer-events: none;
      box-shadow: 0 8px 22px rgba(0,0,0,.32);
    }
    .compare input {
      position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0;
    }
    .image-label {
      position: absolute; bottom: 12px; padding: 5px 8px; border-radius: 8px;
      background: rgba(11,11,16,.72); color: var(--text); font-size: 10px; font-weight: 800;
      backdrop-filter: blur(8px); pointer-events: none;
    }
    .image-label.source { left: 12px; }
    .image-label.result { right: 12px; }
    .save-card {
      position: absolute; top: 12px; right: 12px; z-index: 4; width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 11px; background: rgba(11,11,16,.75);
      color: var(--text); cursor: pointer; font-size: 18px; backdrop-filter: blur(8px);
    }
    .save-card.saved { color: var(--peach); }
    .card-body { padding: 17px; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .badge {
      display: inline-flex; align-items: center; min-height: 25px; padding: 0 8px;
      border-radius: 7px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07);
      color: #C7C5CF; font-size: 10px; font-weight: 750;
    }
    .badge.accent-badge { background: rgba(139,108,255,.12); color: #C7BCFF; border-color: rgba(139,108,255,.2); }
    .card-body h3 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.02em; }
    .card-body p { margin: 0; color: var(--muted); font-size: 12px; }
    .benefits {
      display: grid; grid-template-columns: 1.18fr .92fr; grid-template-rows: 1fr 1fr; gap: 16px;
    }
    .benefit {
      min-height: 190px; padding: 27px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); position: relative; overflow: hidden;
    }
    .benefit:first-child { grid-row: 1 / 3; min-height: 396px; background:
      linear-gradient(145deg, rgba(139,108,255,.14), transparent 50%), var(--surface); }
    .benefit h3 { font-size: 25px; margin: 54px 0 9px; letter-spacing: -.03em; }
    .benefit:first-child h3 { margin-top: 170px; font-size: 33px; }
    .benefit p { margin: 0; color: var(--muted); max-width: 440px; }
    .benefit-icon {
      width: 48px; height: 48px; border: 1px solid var(--line-strong); border-radius: 14px;
      display: grid; place-items: center; color: #C5BAFF; font-size: 21px;
      background: rgba(139,108,255,.09);
    }
    .how-section {
      padding: 78px 0; border-block: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.018), transparent);
    }
    .steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 34px; counter-reset: steps; }
    .step { position: relative; padding: 26px 24px 30px; min-height: 225px; counter-increment: steps; }
    .step:not(:last-child)::after {
      content: ""; position: absolute; top: 49px; left: 78px; right: -17px;
      height: 1px; background: linear-gradient(90deg, rgba(139,108,255,.5), rgba(255,255,255,.08));
    }
    .step-num {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--line); color: #B9ABFF; font-weight: 800;
    }
    .step h3 { font-size: 22px; margin: 35px 0 8px; }
    .step p { margin: 0; color: var(--muted); }

    .explore-hero { padding: 65px 0 35px; }
    .explore-hero h1 { margin: 0 0 10px; font-size: clamp(42px,5vw,70px); line-height: 1; letter-spacing: -.055em; }
    .explore-hero p { color: var(--muted); font-size: 17px; margin: 0; }
    .search-panel {
      margin-top: 30px; display: grid; grid-template-columns: 1fr auto; gap: 10px;
    }
    .search-panel input {
      height: 56px; border-radius: 14px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); padding: 0 18px; font-size: 16px;
    }
    .search-panel input::placeholder { color: #858391; }
    .mobile-filter-btn { display: none; }
    .explore-layout {
      display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 34px; padding: 24px 0 100px;
    }
    .filters {
      position: sticky; top: calc(var(--header) + 20px); align-self: start;
      max-height: calc(100dvh - var(--header) - 40px); overflow-y: auto; padding-right: 6px;
    }
    .filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .filter-head h2 { margin: 0; font-size: 18px; }
    .clear-btn { border: 0; background: transparent; color: #B9ABFF; cursor: pointer; font-size: 12px; }
    .filter-group { padding: 18px 0; border-top: 1px solid var(--line); }
    .filter-group h3 { margin: 0 0 11px; font-size: 12px; color: #D9D6DF; }
    .filter-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-options .chip { min-height: 33px; padding: 0 10px; font-size: 11px; }
    .results-top { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; }
    .results-count { color: var(--muted); font-size: 13px; }
    .select {
      min-height: 41px; padding: 0 34px 0 12px; border: 1px solid var(--line); border-radius: 11px;
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    .empty-state {
      min-height: 350px; display: grid; place-items: center; text-align: center;
      border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 40px;
    }
    .empty-state .empty-icon {
      width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 17px;
      display: grid; place-items: center; background: rgba(139,108,255,.11); color: #C5B9FF; font-size: 25px;
    }
    .empty-state h3 { margin: 0 0 7px; font-size: 22px; }
    .empty-state p { margin: 0 0 20px; color: var(--muted); max-width: 430px; }
    .filter-drawer {
      position: fixed; z-index: 65; inset: auto 0 0 0; max-height: 84dvh; overflow: auto;
      background: #14141D; border-top: 1px solid var(--line-strong); border-radius: 22px 22px 0 0;
      padding: 22px 20px 30px; box-shadow: 0 -20px 60px rgba(0,0,0,.5);
    }

    .detail-top { padding: 28px 0 0; }
    .detail-nav { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; }
    .detail-nav-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .back-btn { width: 41px; height: 41px; border-radius: 12px; flex: 0 0 auto; }
    .breadcrumb { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-actions { display: flex; gap: 8px; }
    .detail-compare {
      height: min(68dvh, 720px); min-height: 480px; border-radius: 22px; overflow: hidden;
      border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--surface);
    }
    .detail-compare .image-label { bottom: 20px; padding: 7px 10px; font-size: 11px; }
    .detail-compare .image-label.source { left: 20px; }
    .detail-compare .image-label.result { right: 20px; }
    .detail-layout {
      display: grid; grid-template-columns: minmax(0,1fr) 440px; gap: 64px; align-items: start;
      padding: 70px 0 95px;
    }
    .detail-content h1 {
      margin: 0 0 17px; font-size: clamp(40px,4.8vw,67px); line-height: 1; letter-spacing: -.05em;
    }
    .lead { font-size: 19px; color: #C2C0CA; max-width: 690px; }
    .info-section { padding: 28px 0; border-top: 1px solid var(--line); }
    .info-section:first-of-type { margin-top: 35px; }
    .info-section h2 { margin: 0 0 15px; font-size: 22px; }
    .check-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .check-item {
      min-height: 45px; display: flex; align-items: center; gap: 10px; color: #D2CFD7; font-size: 14px;
    }
    .check-mark {
      width: 23px; height: 23px; border-radius: 7px; flex: 0 0 auto;
      display: grid; place-items: center; background: rgba(103,216,178,.11); color: var(--mint); font-size: 12px;
    }
    .change-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .change-item {
      min-height: 90px; padding: 14px; border-radius: 14px; background: var(--surface);
      border: 1px solid var(--line); display: flex; align-items: end; font-weight: 700; font-size: 13px;
    }

    }

      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition-duration: .01ms !important; }
    }

          </div>

        ${state.mobileMenu ? `<div class="mobile-drawer">
          <button class="btn btn-ghost" data-route="explore">Explore styles</button>

    function compareMarkup(style, large=false) {
      return `<div class="compare ${large?"compare-large":""}" data-compare>
        <div class="compare-base"><img src="${style.source}" alt="Source photo for ${esc(style.title)}" loading="${large?"eager":"lazy"}"></div>

    function styleCard(style, compact=false) {

        <section class="section-tight container">

          <div class="category-strip" aria-label="Style categories">
            ${categories.map(c => `<button class="chip" data-category-route="${esc(c)}">${esc(c)}</button>`).join("")}

          <div class="section-head"><h2>Made for your photos</h2><p>See what changes, keep what matters, and carry the prompt to the editor you trust.</p></div>
          <div class="benefits">
            <article class="benefit"><div class="benefit-icon">↔</div><h3>See the result first</h3><p>Every style pairs a source photo with an AI result, so you can judge the transformation before copying anything.</p></article>
            <article class="benefit"><div class="benefit-icon">⌁</div><h3>Use the right prompt</h3><p>Prompts are written and tested for photo transformation.</p></article>
            <article class="benefit"><div class="benefit-icon">♡</div><h3>Save your favorites</h3><p>Build a personal collection of styles worth trying.</p></article>

            <article class="step"><span class="step-num">03</span><div><h3>Save what works</h3><p>Keep prompts, styles, and finished images in your private library.</p></div></article>
          </div>
          <button class="btn btn-primary" data-route="explore">Explore styles</button>

    function filterPanel(isDrawer=false) {
      return `<div class="${isDrawer?"filter-drawer":"filters"}" ${isDrawer?'role="dialog" aria-modal="true" aria-label="Style filters"':""}>
        <div class="filter-head"><h2>Filters</h2><div>
          <button class="clear-btn" data-clear-filters>Clear all</button>
          ${isDrawer?'<button class="icon-btn close-btn" data-close-filter aria-label="Close filters">×</button>':""}
        </div></div>
        ${Object.entries(filterGroups).map(([key, values]) => `
          <section class="filter-group">
            <h3>${groupLabels[key]}</h3>
            <div class="filter-options">${values.map(v => `<button class="chip ${state.filters[key].has(v)?"active":""}" data-filter-group="${key}" data-filter-value="${esc(v)}" aria-pressed="${state.filters[key].has(v)}">${esc(v)}</button>`).join("")}</div>
          </section>`).join("")}
        ${isDrawer?'<button class="btn btn-primary" style="width:100%" data-apply-filter>Show results</button>':""}
      </div>`;
    }

    function filteredStyles() {
      let output = styles.filter(s => {
        const q = state.search.trim().toLowerCase();
        const matchesSearch = !q || [s.title,s.category,s.subject,s.intent,s.tool].some(v => v.toLowerCase().includes(q));
        const matchesFilters = Object.keys(filterGroups).every(key => state.filters[key].size === 0 || state.filters[key].has(s[key]));
        return matchesSearch && matchesFilters;
      });
      if (state.sort === "Most saved") output.sort((a,b) => b.saved-a.saved);
      if (state.sort === "Newest") output = [...output].reverse();
      return output;
    }

    function exploreView() {
      const results = filteredStyles();
      return `<div class="view">
        <section class="container explore-hero">
          <h1>Find a style for your photo</h1>
          <p>Browse styles tested for portraits, pets, places, objects, and more.</p>
          <form class="search-panel" id="exploreSearch">
            <label class="sr-only" for="mainSearch">Search styles</label>
            <input id="mainSearch" type="search" placeholder="Search cinematic, watercolor, headshot, anime..." value="${esc(state.search)}">
            <button type="button" class="btn btn-secondary mobile-filter-btn" id="openFilters">Filters</button>
          </form>
        </section>
        <section class="container explore-layout">
          ${filterPanel()}
          <div>
            <div class="results-top">
              <span class="results-count">${results.length} ${results.length===1?"style":"styles"}</span>
              <label><span class="sr-only">Sort styles</span><select class="select" id="sortSelect">

          </div>
        </section>
        ${state.filterDrawer ? filterPanel(true) : ""}
      </div>`;
    }

    function detailProfile(style) {
      if (style.id === "cinematic-window") return {
        description: "Turn a clear portrait into a soft cinematic image with natural window light and a refined film look.",
        best: ["One visible face","Good lighting","Face not hidden by hands or objects","Original image should not be blurry"],
        changes: ["Lighting","Background","Color mood","Film texture"],
        stays: ["Face and facial proportions","Skin tone","Hairstyle","Expression","Pose","Clothing"]
      };
      if (style.subject === "Pet") return {
        description: `Turn a clear pet photo into ${style.title.toLowerCase()} while preserving the animal's recognizable features and expression.`,
        best: ["Eyes clearly visible","Full head in frame","Even lighting on fur","Original image should not be blurry"],
        changes: ["Art medium","Background","Color mood","Surface texture"],
        stays: ["Face shape","Fur pattern","Eye color","Expression","Body proportions","Distinctive markings"]
      };
      if (style.subject === "Place") return {
        description: `Restyle a favorite place with the ${style.title.toLowerCase()} look while keeping the scene easy to recognize.`,
        best: ["Clear focal point","Balanced exposure","Important landmarks visible","Original image should not be blurry"],
        changes: ["Lighting","Sky and atmosphere","Color mood","Surface texture"],
        stays: ["Landmarks","Scene layout","Perspective","Main objects","Sense of place","Composition"]
      };
      if (style.subject === "Product or object") return {
        description: `Present one object in the ${style.title.toLowerCase()} look with clean edges, realistic materials, and a refined background.`,
        best: ["One main object","Object fully in frame","Clean visible edges","Original image should not be blurry"],
        changes: ["Lighting","Background","Color mood","Studio finish"],
        stays: ["Object shape","Material","Brand-free details","Proportions","Main color","Functional parts"]
      };
      if (style.subject === "Group") return {
        description: `Transform a group photo with the ${style.title.toLowerCase()} look while keeping every person recognizable.`,
        best: ["All faces visible","Even group lighting","Minimal motion blur","People not heavily overlapping"],
        changes: ["Color treatment","Background mood","Lighting","Image texture"],
        stays: ["Faces","Skin tones","Hairstyles","Expressions","Poses","Clothing"]
      };
      return {
        description: `Turn a clear portrait into the ${style.title.toLowerCase()} look while preserving the person's recognizable identity.`,
        best: ["One visible face","Good lighting","Face not hidden by hands or objects","Original image should not be blurry"],
        changes: ["Style treatment","Background","Color mood","Image texture"],
        stays: ["Face and facial proportions","Skin tone","Hairstyle","Expression","Pose","Clothing"]
      };
    }

    function naturalList(items) {
      if (items.length < 2) return items[0] || "";
      if (items.length === 2) return `${items[0]} and ${items[1]}`;
      return `${items.slice(0,-1).join(", ")}, and ${items.at(-1)}`;
    }

    function generatedPrompt() {
      const style = styles.find(s => s.id === state.detailId) || styles[0];
      if (style.id !== "cinematic-window") {
        const subject = style.subject === "Person" ? "person" : style.subject.toLowerCase();
        const details = ["recognizable identity","proportions","defining features","expression"];
        if (state.prompt.keepPose) details.push("pose");
        if (state.prompt.keepClothing) details.push("clothing");
        return `Edit the uploaded ${subject} photo into the ${style.title} look. Use the main subject in the source image as the subject. Preserve ${naturalList(details)}. Apply a refined ${style.category.toLowerCase()} treatment with ${state.prompt.mood.toLowerCase()} color grading. Use ${state.prompt.background.toLowerCase()} while keeping natural, accurate edges around the subject. Keep important textures realistic. Do not add people, lettering, or logos. Compose for ${state.prompt.ratio} without cropping important features.`;
      }
      const details = ["recognizable facial features","facial proportions","skin tone","hairstyle","expression"];
      if (state.prompt.keepPose) details.push("pose");
      if (state.prompt.keepClothing) details.push("clothing");
      return `Edit the uploaded portrait into a cinematic photograph. Use the person in the source image as the subject. Preserve their ${naturalList(details)}. Apply soft directional window light, gentle shadow falloff, subtle film grain, and ${state.prompt.mood.toLowerCase()} color grading. Replace the background with ${state.prompt.background.toLowerCase()}, keeping natural edges around the hair. Keep skin texture realistic. Do not add people, lettering, or logos. Compose for ${state.prompt.ratio} without cropping important facial features.`;
    }

    function detailView() {
      const style = styles.find(s => s.id === state.detailId) || styles[0];
      const profile = detailProfile(style);
      const saved = state.savedStyles.includes(style.id);
      const related = styles.filter(s => s.id !== style.id).slice(3,7);
      const examples = [
        ["cinema-example-source-1","cinema-example-result-1"],
        ["cinema-example-source-2","cinema-example-result-2"],
        ["cinema-example-source-3","cinema-example-result-3"]
      ];
      return `<div class="view">
        <section class="container detail-top">
          <div class="detail-nav">
            <div class="detail-nav-left">
              <button class="icon-btn back-btn" data-route="explore" aria-label="Back to explore">←</button>
              <span class="breadcrumb">Explore / ${esc(style.category)} / ${esc(style.title)}</span>
            </div>
            <div class="detail-actions">
              <button class="btn btn-secondary save-style-btn" data-save="${style.id}">${saved?"♥ Saved":"♡ Save style"}</button>
              <button class="btn btn-ghost share-btn" data-share>↗ Share</button>
            </div>
          </div>
          <div class="detail-compare">${compareMarkup(style,true)}</div>
        </section>

        <section class="container detail-layout">
          <article class="detail-content">
            <div class="badge-row">
              <span class="badge accent-badge">${esc(style.category)}</span><span class="badge">${esc(style.subject)}</span>
              <span class="badge">${esc(style.requirement)}</span><span class="badge">${esc(style.tool)}</span>
            </div>
            <h1>${esc(style.title)}</h1>
            <p class="lead">${esc(profile.description)}</p>
            <section class="info-section"><h2>Best source photo</h2><div class="check-grid">
              ${profile.best.map(x => `<div class="check-item"><span class="check-mark">✓</span>${x}</div>`).join("")}
            </div></section>
            <section class="info-section"><h2>What changes</h2><div class="change-grid">
              ${profile.changes.map(x => `<div class="change-item">${x}</div>`).join("")}
            </div></section>
            <section class="info-section"><h2>What should stay recognizable</h2><div class="check-grid">
              ${profile.stays.map(x => `<div class="check-item"><span class="check-mark">✓</span>${x}</div>`).join("")}
            </div><div class="warning">AI tools can still change small details. Review the final result before using it professionally.</div></section>
          </article>

          <aside class="prompt-panel">
            <h2>Customize this prompt</h2>
            <p>Adjust the details, then copy the prompt to your AI image editor.</p>
            <div class="control-grid">
              <div class="field"><label for="moodSelect">Color mood</label><select id="moodSelect">
                ${["Warm neutral","Deep blue","Soft pastel","Black and white"].map(v => `<option ${state.prompt.mood===v?"selected":""}>${v}</option>`).join("")}
              </select></div>
              <div class="field"><label for="backgroundSelect">Background</label><select id="backgroundSelect">
                ${["Softly blurred interior","Window-lit studio","Minimal cream wall","Keep original background"].map(v => `<option ${state.prompt.background===v?"selected":""}>${v}</option>`).join("")}
              </select></div>
              <div class="field full"><label for="ratioSelect">Output ratio</label><select id="ratioSelect">
                ${["4:5 Portrait","1:1 Square","9:16 Story"].map(v => `<option ${state.prompt.ratio===v?"selected":""}>${v}</option>`).join("")}
              </select></div>
            </div>
            <div class="toggle-row"><span>Keep clothing from original photo</span><label class="switch"><input id="clothingToggle" type="checkbox" ${state.prompt.keepClothing?"checked":""}><span></span></label></div>
            <div class="toggle-row"><span>Keep original pose</span><label class="switch"><input id="poseToggle" type="checkbox" ${state.prompt.keepPose?"checked":""}><span></span></label></div>
            <div class="prompt-box" id="promptBox">${esc(generatedPrompt())}</div>
            <div class="panel-actions">
              <button class="btn btn-primary" id="copyPrompt">Copy prompt</button>
              <button class="btn btn-secondary" data-save="${style.id}">Save to collection</button>
              <button class="btn btn-secondary" data-modal="save-result">Save your result</button>
              <button class="btn btn-ghost" data-route="explore">Try another style</button>
            </div>
            <div class="guide">
              <h3>Use this prompt</h3>
              <ol><li>Open ChatGPT Image or another compatible editor</li><li>Upload your own photo there</li><li>Paste this prompt</li><li>Generate and check your result</li></ol>
              <button class="text-link" data-modal="external-info">Why does this use an external tool?</button>
            </div>
          </aside>
        </section>

        <section class="section-tight container">
          <div class="section-title-row"><h2>More examples</h2></div>
          <div class="example-grid">${examples.map(([a,b]) => `<div class="example-pair">
            <div><img src="https://picsum.photos/seed/${a}/650/800" alt="Source photo example" loading="lazy"><span class="image-label source">Source photo</span></div>
            <div><img src="https://picsum.photos/seed/${b}/650/800" alt="AI result example" loading="lazy"><span class="image-label result">AI result</span></div>
          </div>`).join("")}</div>
        </section>

        <section class="section container">
          <div class="section-title-row"><h2>Related styles</h2><button class="text-link" data-route="explore">Explore all →</button></div>
          <div class="style-grid">${related.map(s => styleCard(s,true)).join("")}</div>
        </section>
        <section class="container permission">
          <div class="permission-icon">✓</div><div><h2>Created with your photo in mind</h2><p>Only upload photos you own or have permission to use. Keep recognizable people informed about how their images are edited.</p></div>
        </section>
      </div>`;
    }

    function libraryView() {
      if (!state.signedIn) {
        return `<div class="view"><section class="container section"><div class="empty-state"><div><div class="empty-icon">♡</div><h3>Sign in to open your library</h3><p>Keep saved styles, collections, and your finished transformations together.</p><button class="btn btn-primary" data-modal="signin">Sign in</button></div></div></section></div>`;
      }
      return `<div class="view">
        <section class="container library-head"><h1>My library</h1><p>Your saved styles and finished transformations stay in this browser.</p></section>
        <div class="container tabs" role="tablist">
          ${[["saved","Saved styles"],["collections","Collections"],["creations","My creations"]].map(([id,label]) => `<button class="tab ${state.libraryTab===id?"active":""}" data-tab="${id}" role="tab" aria-selected="${state.libraryTab===id}">${label}</button>`).join("")}
        </div>
        <section class="container tab-panel">${libraryPanel()}</section>
      </div>`;
    }

    function libraryPanel() {
      if (state.libraryTab === "saved") {
        const saved = styles.filter(s => state.savedStyles.includes(s.id));
        return `<div class="library-toolbar"><h2>Saved styles</h2><button class="btn btn-secondary" data-route="explore">Explore more</button></div>
          ${saved.length ? `<div class="style-grid">${saved.map(s => styleCard(s,true)).join("")}</div>` :
          `<div class="empty-state"><div><div class="empty-icon">♡</div><h3>No saved styles yet</h3><p>Explore looks you want to try.</p><button class="btn btn-primary" data-route="explore">Explore styles</button></div></div>`}`;
      }
      if (state.libraryTab === "collections") {
        return `<div class="library-toolbar"><h2>Collections</h2><button class="btn btn-primary" data-modal="collection">New collection</button></div>
          <div class="collections-grid">${state.collections.map(c => {
            const ids = c.id === "saved-styles" ? state.savedStyles : c.styleIds;
            const items = styles.filter(s => ids.includes(s.id));
            return `<article class="collection-card">
              <div class="collection-preview">${items.slice(0,3).map(s => `<img src="${s.result}" alt="">`).join("") || `<div class="empty-icon">♡</div>`}</div>
              <div><h3>${esc(c.name)}</h3><p>${items.length} ${items.length===1?"style":"styles"}</p></div>
            </article>`;
          }).join("")}</div>
          ${state.savedStyles.length ? `<section class="section-tight"><div class="section-title-row"><h2>Organize saved styles</h2></div><div class="style-grid">${styles.filter(s=>state.savedStyles.includes(s.id)).map(s => `
            <div>${styleCard(s,true)}<select class="select move-select" data-move-style="${s.id}" aria-label="Move ${esc(s.title)} to collection">
              <option value="">Add to collection...</option>${state.collections.filter(c=>c.id!=="saved-styles").map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}
            </select></div>`).join("")}</div></section>` : ""}`;
      }
      const creations = state.creations;
      return `<div class="library-toolbar"><h2>My creations</h2><button class="btn btn-primary" data-modal="save-result">Add a result</button></div>
        ${creations.length ? `<div class="creation-grid">${creations.map(c => creationCard(c)).join("")}</div>` :
        `<div class="empty-state"><div><div class="empty-icon">↔</div><h3>Your transformations will appear here</h3><p>Create them in an AI image editor, then save the finished images in this private browser library.</p><button class="btn btn-primary" data-route="explore">Find a style</button></div></div>`}`;
    }

    function creationCard(c) {
      return `<article class="creation-card">
        <div class="creation-images">
          ${c.source ? `<img src="${c.source}" alt="Source photo">` : `<div class="no-source">No source photo saved</div>`}
          <img src="${c.result}" alt="Saved AI result">
        </div>
        <div class="creation-body">
          <div class="creation-meta"><span>${esc(c.styleName)}</span><span>${esc(c.date)}</span></div>
          <h3>${esc(c.styleName)}</h3>
          ${c.notes ? `<p>${esc(c.notes)}</p>` : ""}
          <div class="prompt-snapshot">${esc(c.prompt)}</div>
          <div class="creation-actions"><a class="btn btn-secondary" href="${c.result}" download="ai-prompt-grid-result.jpg">Download</a><button class="btn btn-danger" data-delete-creation="${c.id}">Delete</button></div>
        </div>
      </article>`;
    }

    function render(options={}) {
      renderHeader();
      if (state.route === "home") app.innerHTML = homeView();
      if (state.route === "explore") app.innerHTML = exploreView();
      if (state.route === "detail") app.innerHTML = detailView();
      if (state.route === "library") app.innerHTML = libraryView();
      if (!options.keepScroll) window.scrollTo({ top:0, behavior:"instant" });
      if (options.focus !== false) app.focus({ preventScroll:true });
    }

    function navigate(route, extra) {
      state.mobileMenu = false; state.profileOpen = false; state.filterDrawer = false;
      if (route === "categories") {
        state.route = "explore"; render();
        setTimeout(() => document.getElementById("mainSearch")?.focus(), 50);
        return;
      }
      if (route === "how") {
        state.route = "home"; render({focus:false});
        setTimeout(() => document.getElementById("how-it-works")?.scrollIntoView({behavior:"smooth"}), 30);
        return;
      }
      state.route = route;
      if (extra) state.detailId = extra;
      render();
    }

    function toggleSave(id) {
      if (!state.signedIn) { openModal("signin"); return; }
      const index = state.savedStyles.indexOf(id);
      if (index >= 0) {
        state.savedStyles.splice(index,1);
        state.collections.forEach(c => c.styleIds = c.styleIds.filter(x => x !== id));
        toast("Style removed from your library.");
      } else {
        state.savedStyles.push(id);
        const standard = state.collections.find(c => c.id === "saved-styles");
        if (standard && !standard.styleIds.includes(id)) standard.styleIds.push(id);
        toast("Style saved to your library.", "success");
      }
      persist(); render({keepScroll:true, focus:false});
    }

    function updateCompare(input) {
      const wrap = input.closest("[data-compare]");
      const value = Number(input.value);
      wrap.querySelector(".compare-after").style.clipPath = `inset(0 0 0 ${value}%)`;
      wrap.querySelector(".compare-line").style.left = `${value}%`;
      wrap.querySelector(".compare-handle").style.left = `${value}%`;
    }

    function toast(message, type="success") {
      const node = document.createElement("div");
      node.className = `toast ${type}`;
      node.textContent = message;
      document.getElementById("toastRegion").appendChild(node);
      setTimeout(() => node.remove(), 3800);
    }

    function openModal(type) {
      if (type === "save-result" && !state.signedIn) { openModal("signin"); toast("Sign in to save your transformed result."); return; }
      let content = "";
      if (type === "signin") content = `
        <div class="modal-head"><div><h2>Save styles and build your photo library</h2><p>This is a simulated sign-in for the prototype.</p></div><button class="icon-btn close-btn" data-close-modal aria-label="Close dialog">×</button></div>
        <button class="btn auth-provider" id="googleSignIn">Continue with Google</button>
        <div class="divider">or</div>
        <form id="emailSignIn"><div class="field"><label for="authEmail">Email address</label><input id="authEmail" type="email" required placeholder="you@example.com"></div>
        <button class="btn btn-primary" style="width:100%">Email me a sign-in link</button></form>
        <button class="text-link" id="guestButton">Continue as guest</button>
        <div id="authMessage" aria-live="polite"></div>`;
      if (type === "collection") content = `
        <div class="modal-head"><div><h2>Create a collection</h2><p>Group saved styles around a project, subject, or mood.</p></div><button class="icon-btn close-btn" data-close-modal aria-label="Close dialog">×</button></div>
        <form id="collectionForm"><div class="field"><label for="collectionName">Collection name</label><input id="collectionName" required maxlength="40" placeholder="Portrait ideas"></div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Create collection</button></div></form>`;
      if (type === "external-info") content = `
        <div class="modal-head"><div><h2>Why does this use an external tool?</h2><p>AI Prompt Grid is currently a prompt and style library. It helps you choose a tested transformation and customize the instructions. Built-in image transformation will come later.</p></div><button class="icon-btn close-btn" data-close-modal aria-label="Close dialog">×</button></div>
        <div class="inline-success">For now, copy the prompt, open a compatible AI image editor, and upload your photo there.</div>
        <div class="modal-actions"><button class="btn btn-primary" data-close-modal>Got it</button></div>`;
      if (type === "save-result") {
        const style = styles.find(s => s.id === state.detailId) || styles[0];
        state.uploadDraft = {result:"",source:""};
        content = `
          <div class="modal-head"><div><h2>Save your transformed result</h2><p>Upload the image you created in your AI editor. This prototype stores nothing on a server.</p></div><button class="icon-btn close-btn" data-close-modal aria-label="Close dialog">×</button></div>
          <form id="creationForm">
            <div class="field"><label>Selected style</label><input value="${esc(style.title)}" readonly></div>
            <div class="upload-grid">
              <div class="field"><label>AI result</label><div class="upload-box" id="resultPreview"><input type="file" id="resultUpload" accept="image/*"><div class="upload-copy"><strong>Select your AI result</strong>Choose an image from your device</div></div></div>
              <div class="field"><label>Source photo (optional)</label><div class="upload-box" id="sourcePreview"><input type="file" id="sourceUpload" accept="image/*"><div class="upload-copy"><strong>Add the source photo</strong>Build a before-and-after pair</div></div></div>
            </div>
            <div class="field"><label for="creationNotes">Note (optional)</label><textarea id="creationNotes" maxlength="240" placeholder="What worked well with this transformation?"></textarea></div>
            <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Save to my creations</button></div>
          </form>`;
      }
      modalRoot.innerHTML = `<div class="modal-layer" data-modal-layer><div class="modal ${type==="save-result"?"wide":""}" role="dialog" aria-modal="true" aria-label="${type==="signin"?"Sign in":type==="collection"?"Create collection":type==="save-result"?"Save transformed result":"Information"}">${content}</div></div>`;
      document.body.classList.add("no-scroll");
      setTimeout(() => modalRoot.querySelector("input, button, select, textarea")?.focus(), 20);
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      document.body.classList.remove("no-scroll");
    }

    function readImage(file, callback) {
      if (!file) return;
      if (!file.type.startsWith("image/")) { toast("Please choose an image file.", "error"); return; }
      if (file.size > 3 * 1024 * 1024) { toast("For this prototype, choose an image under 3 MB.", "error"); return; }
      const reader = new FileReader();
      reader.onload = () => callback(reader.result);
      reader.onerror = () => toast("That image could not be read.", "error");
      reader.readAsDataURL(file);
    }

    document.addEventListener("click", event => {
      const route = event.target.closest("[data-route]");
      if (route) { navigate(route.dataset.route); return; }
      const category = event.target.closest("[data-category-route]");
      if (category) {
        Object.values(state.filters).forEach(set => set.clear());
        state.filters.category.add(category.dataset.categoryRoute);
        navigate("explore"); return;
      }
      const save = event.target.closest("[data-save]");
      if (save) { event.stopPropagation(); toggleSave(save.dataset.save); return; }
      const card = event.target.closest("[data-style-id]");
      if (card && !event.target.closest("input")) { navigate("detail", card.dataset.styleId); return; }
      const modal = event.target.closest("[data-modal]");
      if (modal) { openModal(modal.dataset.modal); return; }
      if (event.target.closest("[data-close-modal]") || (event.target.matches("[data-modal-layer]"))) { closeModal(); return; }
      if (event.target.closest("#menuToggle")) { state.mobileMenu = !state.mobileMenu; renderHeader(); return; }
      if (event.target.closest("#profileButton")) { state.profileOpen = !state.profileOpen; renderHeader(); return; }
      if (event.target.closest("#signOutButton")) {
        state.signedIn = false; state.profileOpen = false; persist(); navigate("home"); toast("Signed out."); return;
      }
      if (event.target.closest("#googleSignIn")) {
        state.signedIn = true; persist(); closeModal(); renderHeader(); toast("You are signed in.", "success"); return;
      }
      if (event.target.closest("#guestButton")) { closeModal(); toast("Continuing as a guest. Sign in when you want to save."); return; }
      if (event.target.closest("#openFilters")) { state.filterDrawer = true; render({keepScroll:true,focus:false}); document.body.classList.add("no-scroll"); return; }
      if (event.target.closest("[data-close-filter]") || event.target.closest("[data-apply-filter]")) {
        state.filterDrawer = false; document.body.classList.remove("no-scroll"); render({keepScroll:true,focus:false}); return;
      }
      const filter = event.target.closest("[data-filter-group]");
      if (filter) {
        const set = state.filters[filter.dataset.filterGroup];
        set.has(filter.dataset.filterValue) ? set.delete(filter.dataset.filterValue) : set.add(filter.dataset.filterValue);
        render({keepScroll:true,focus:false}); return;
      }
      if (event.target.closest("[data-clear-filters]")) {
        Object.values(state.filters).forEach(set => set.clear()); state.search = "";
        render({keepScroll:true,focus:false}); return;
      }
      const tab = event.target.closest("[data-tab]");
      if (tab) { state.libraryTab = tab.dataset.tab; render({keepScroll:true,focus:false}); return; }
      if (event.target.closest("#copyPrompt")) {
        const text = generatedPrompt();
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        else fallbackCopy(text);
        toast("Prompt copied. Open your AI image editor and upload your photo there.", "success"); return;
      }
      if (event.target.closest("[data-share]")) {
        const text = `AI Prompt Grid: ${styles.find(s=>s.id===state.detailId)?.title || "Style"}`;
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(location.href);
        toast(`${text} link copied.`, "success"); return;
      }
      const del = event.target.closest("[data-delete-creation]");
      if (del) {
        state.creations = state.creations.filter(c => c.id !== del.dataset.deleteCreation);
        persist(); render({keepScroll:true,focus:false}); toast("Creation deleted."); return;
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (modalRoot.innerHTML) closeModal();
        else if (state.filterDrawer) { state.filterDrawer=false; document.body.classList.remove("no-scroll"); render({keepScroll:true,focus:false}); }
        else if (state.mobileMenu || state.profileOpen) { state.mobileMenu=false; state.profileOpen=false; renderHeader(); }
      }
      if (event.key === "Tab") {
        const activeDialog = modalRoot.querySelector("[role=dialog]") || document.querySelector(".filter-drawer[role=dialog]");
        if (activeDialog) {
          const focusable = [...activeDialog.querySelectorAll("button, input, select, textarea, a[href], [tabindex]:not([tabindex='-1'])")]
            .filter(element => !element.disabled && element.offsetParent !== null);
          if (focusable.length) {
            const first = focusable[0], last = focusable.at(-1);
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        }
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-style-id]") && !event.target.matches("button,input")) {
        event.preventDefault(); navigate("detail", event.target.dataset.styleId);
      }
    });

    document.addEventListener("input", event => {
      if (event.target.matches("[data-compare] input[type=range]")) updateCompare(event.target);
      if (event.target.id === "mainSearch") {
        state.search = event.target.value;
        clearTimeout(window.searchTimer);
        window.searchTimer = setTimeout(() => render({keepScroll:true,focus:false}), 180);
      }
    });

    document.addEventListener("error", event => {
      if (event.target instanceof HTMLImageElement && !event.target.dataset.fallback) {
        event.target.dataset.fallback = "true";
        event.target.alt = `${event.target.alt} (image unavailable)`;
        event.target.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      }
    }, true);

    document.addEventListener("change", event => {
      if (event.target.id === "sortSelect") { state.sort = event.target.value; render({keepScroll:true,focus:false}); }
      if (event.target.id === "moodSelect") { state.prompt.mood=event.target.value; updatePromptOnly(); }
      if (event.target.id === "backgroundSelect") { state.prompt.background=event.target.value; updatePromptOnly(); }
      if (event.target.id === "ratioSelect") { state.prompt.ratio=event.target.value; updatePromptOnly(); }
      if (event.target.id === "clothingToggle") { state.prompt.keepClothing=event.target.checked; updatePromptOnly(); }
      if (event.target.id === "poseToggle") { state.prompt.keepPose=event.target.checked; updatePromptOnly(); }
      if (event.target.id === "resultUpload") readImage(event.target.files[0], value => {
        state.uploadDraft.result=value; document.getElementById("resultPreview").insertAdjacentHTML("beforeend",`<img src="${value}" alt="AI result preview">`);
      });
      if (event.target.id === "sourceUpload") readImage(event.target.files[0], value => {
        state.uploadDraft.source=value; document.getElementById("sourcePreview").insertAdjacentHTML("beforeend",`<img src="${value}" alt="Source photo preview">`);
      });
      if (event.target.matches("[data-move-style]") && event.target.value) {
        const collection = state.collections.find(c => c.id === event.target.value);
        if (collection && !collection.styleIds.includes(event.target.dataset.moveStyle)) collection.styleIds.push(event.target.dataset.moveStyle);
        persist(); toast(`Added to ${collection.name}.`); event.target.value="";
      }
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      if (event.target.id === "headerSearch") {
        state.search = document.getElementById("quickSearch").value; navigate("explore"); return;
      }
      if (event.target.id === "exploreSearch") return;
      if (event.target.id === "emailSignIn") {
        document.getElementById("authMessage").innerHTML = `<div class="inline-success">Check your inbox for a sign-in link.</div>`;
        return;
      }
      if (event.target.id === "collectionForm") {
        const name = document.getElementById("collectionName").value.trim();
        if (!name) return;
        state.collections.push({ id:`collection-${Date.now()}`, name, styleIds:[] });
        persist(); closeModal(); state.libraryTab="collections"; render({keepScroll:true,focus:false}); toast("Collection created.", "success"); return;
      }
      if (event.target.id === "creationForm") {
        if (!state.uploadDraft.result) { toast("Select your transformed result first.", "error"); return; }
        const style = styles.find(s=>s.id===state.detailId) || styles[0];
        state.creations.unshift({
          id:`creation-${Date.now()}`, result:state.uploadDraft.result, source:state.uploadDraft.source,
          styleName:style.title, date:new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",year:"numeric"}).format(new Date()),
          notes:document.getElementById("creationNotes").value.trim(), prompt:generatedPrompt()
        });
        persist(); closeModal(); toast("Result saved to My creations.", "success");
        if (state.route === "library") { state.libraryTab="creations"; render({keepScroll:true,focus:false}); }
      }
    });

    function updatePromptOnly() {
      const box = document.getElementById("promptBox");
      if (box) box.textContent = generatedPrompt();
    }
    function fallbackCopy(text) {
      const area = document.createElement("textarea"); area.value=text; document.body.appendChild(area);
      area.select(); document.execCommand("copy"); area.remove();
    }

    render();
  </script>
</body>
</html>
