          - generic [ref=f14e56]:
            - generic [ref=f14e57]: Prompt
            - button "Copy prompt" [ref=f14e58] [cursor=pointer]
          - code [ref=f14e63]: "Merge the first uploaded photo and the second uploaded photo into one natural group photo of a couple standing side by side. The first uploaded photo shows person A and the second uploaded photo shows person B. Follow the selected source-preservation settings: identities and facial features. Always keep person A's face shape, eyes, nose, lips, hairline, hair, any beard, glasses, or head covering, apparent age, and exact skin tone as in the first uploaded photo, and person B's exactly as in the second uploaded photo. Treat them as two separate people; do not blend, swap, beautify, slim, de-age, or lighten either face, and keep natural skin texture. Keep the outfit each person wears in their own photo. If group arrangement and pose are not preserved, stand them close together, one arm around the other's shoulder, both smiling at the camera, with realistic relative heights. Light both people with one warm, low sun from the left so they look photographed together, with matching shadows and color temperature. Apply luminous golden-hour warmth color grading. Replace the background with riverside promenade with a calm river, trees along the bank, and warm late-afternoon light, keeping clean edges around hair and clothing. Do not add extra people, text, lettering, or logos. Compose for 4:5 Portrait without cropping either face."
        - paragraph [ref=f14e64]: The people and animals in the before photos are AI-generated, not real. Every after image on this page is an AI edit of those two sources.
