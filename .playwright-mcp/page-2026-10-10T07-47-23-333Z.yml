        - heading "FAQ" [level=2] [ref=f14e401]
        - heading "How do I merge two photos in Gemini?" [level=3] [ref=f14e402]
        - paragraph [ref=f14e403]: Attach both photos in one message, then paste a prompt that names each photo, describes the scene, and says to keep both faces exactly the same. Start with the riverside prompt. Fix problems with a short follow-up in the same chat.
        - heading "What is a good Gemini prompt to combine two photos of a couple?" [level=3] [ref=f14e404]
        - paragraph [ref=f14e405]: Use the riverside prompt for one shared scene, or the keepsake frame when you want to combine two photos in one frame without changing either original.
        - heading "How do I add someone to a group photo?" [level=3] [ref=f14e406]
        - paragraph [ref=f14e407]: Upload the group photo first and the missing person's photo second. The add-a-person prompt places them at the right end and matches their size and light.
        - heading "Can ChatGPT merge two photos too?" [level=3] [ref=f14e408]
        - paragraph [ref=f14e409]: Yes. Upload both images in one message and number them. The cafe window prompt is written as a longer list, which ChatGPT follows closely.
        - heading "How many people can one merge include?" [level=3] [ref=f14e410]
        - paragraph [ref=f14e411]: Keep it to five people or fewer in one result. For a larger family, merge a smaller group first, then add someone in a follow-up.
