      - heading "How to Merge Two Photos in Gemini (Couple & Family Prompts)" [level=1] [ref=f14e39]
      - paragraph [ref=f14e40]: "How to merge two photos in Gemini: copy-paste couple, family, and pet prompts, plus fixes when the light or the faces look wrong."
      - paragraph [ref=f14e41]: Updated October 9, 2026 · AI Prompt Grid editorial
      - generic [ref=f14e42]:
        - paragraph [ref=f14e43]:
          - strong [ref=f14e44]: "Quick answer:"
          - text: "How to merge two photos in Gemini: attach both photos in one message, then paste a prompt that names each photo and keeps both faces exact. A merge two photos AI prompt like the ones below also works in ChatGPT if you number the images. Use them for a couple, a family, friends, or a pet."
        - heading "Before you paste" [level=2] [ref=f14e45]
        - list [ref=f14e46]:
          - listitem [ref=f14e47]: Open Gemini and check the model is not set to Flash-Lite. That option is not built for several reference photos.
          - listitem [ref=f14e48]: "Attach both photos in the same message, in the order the prompt names: first photo, then second photo."
          - listitem [ref=f14e49]: Ask for one shared light so the people look photographed together.
          - listitem [ref=f14e50]: Check the faces first. If the light, the height, or a face is off, use a short follow-up in the same chat. The tips at the end are for that.
        - paragraph [ref=f14e51]: Similar light and a similar crop merge more easily than a close selfie plus a far full-length shot. Skip sunglasses and heavy beauty filters. Only merge photos of people who agree to it.
        - heading "Couple merges" [level=2] [ref=f14e52]
        - heading "1. Riverside couple" [level=3] [ref=f14e53]
        - paragraph [ref=f14e54]: "A couple photo merge AI prompt: two separate photos become one riverside walk, with one shared late-afternoon light."
