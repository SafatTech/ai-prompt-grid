          - generic [ref=f7e141]: "Edit the uploaded person into a company team headshot with even front lighting and the eyes about one-third from the top of the frame. Follow the selected source-preservation settings: recognizable identity, proportions, defining features, expression, and clothing. If clothing is preserved, keep their own outfit but neaten the collar. If clothing is not preserved, dress them in a plain smart top or shirt in a neutral color. If pose is not preserved, use straight head-and-shoulders framing facing the camera. Keep their face shape, eyes, nose, lips, hairline, any beard, glasses, or head covering, apparent age, and exact skin tone; do not beautify, slim, de-age, or lighten the skin, and keep natural skin texture. Apply bright neutral color grading. Replace the background with soft evenly lit light-grey studio backdrop, keeping clean edges around hair and clothing. Do not add people, text, lettering, or logos. Compose for 1:1 Square without cropping the face."
