          - generic [ref=f2e139]: "Edit the uploaded person into a casual 1980s snapshot sitting on a bed, like a print from an old photo album with visible grain. Follow the selected source-preservation settings: recognizable identity, proportions, defining features, and expression. If clothing is not preserved, keep a simple 1980s casual outfit. If pose is not preserved, seat them on the bed facing the camera. Apply warm nostalgic color grading with direct flash, slightly harsh highlights, warm indoor tones, and faded colors. Replace the background with 1980s teenager bedroom with a cassette player, a stack of tapes, and a patterned bedspread, and add abstract or illustrated music and movie posters with no real people, readable text or logos. Do not add extra people, lettering, or logos. Compose for 4:5 Portrait without cropping the face."
