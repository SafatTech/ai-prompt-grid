          - generic [ref=f6e139]: "Edit the uploaded person into a passport-size style photo on a plain background for a CV or application form, with even, shadow-free front lighting. Follow the selected source-preservation settings: recognizable identity, proportions, defining features, expression, and clothing. If clothing is not preserved, dress them in plain dark smart clothing that contrasts with the background. If pose is not preserved, center the head and upper shoulders, facing straight to the camera, with a neutral expression, mouth closed, and eyes open. Keep any head covering worn for religious reasons, with the full face visible from chin to forehead. Keep their face shape, eyes, nose, lips, hairline, any beard, glasses, or head covering, apparent age, and exact skin tone; do not beautify, slim, de-age, or lighten the skin, and keep natural skin texture. Apply bright neutral color grading. Replace the background with pure white seamless infinity studio background, keeping clean edges around hair and clothing. Do not add people, text, lettering, or logos. Compose for 4:5 Portrait without cropping the face."
