        - paragraph [ref=f4e375]: "A few things that usually cause the drift:"
        - list [ref=f4e376]:
          - listitem [ref=f4e377]: Plastic skin. Ask for natural skin texture.
          - listitem [ref=f4e378]: A lighter skin tone than the photo. Say "keep the skin tone exactly the same."
          - listitem [ref=f4e379]: A younger face. Say the age stays.
          - listitem [ref=f4e380]: A busy backdrop. Soft and plain reads more clearly on a small profile circle.
          - listitem [ref=f4e381]: A missing hijab, glasses or beard. If they wear them day to day, say so.
        - paragraph [ref=f4e382]: "Gemini's image model is sometimes called Nano Banana. The same LinkedIn profile picture prompt works there: attach the photo, paste the prompt, and fix the face in that chat if it drifts. In ChatGPT you can comment on one spot, such as \"straighten the collar,\" instead of rewriting the whole prompt."
        - heading "FAQ" [level=2] [ref=f4e383]
        - heading "What is a good LinkedIn profile picture prompt for Gemini?" [level=3] [ref=f4e384]
        - paragraph [ref=f4e385]: Start with the navy blazer prompt. It changes the outfit and the backdrop and keeps the face. Women can use the black blazer, hijab, dupatta or saree prompts. Men who want a suit can use the charcoal suit prompt.
        - heading "Can I use the same prompt in ChatGPT?" [level=3] [ref=f4e386]
        - paragraph [ref=f4e387]: Yes. Paste it with the photo attached. The charcoal suit prompt is written as a longer list, which ChatGPT follows closely.
        - heading "Is this a Gemini AI resume photo prompt?" [level=3] [ref=f4e388]
        - paragraph [ref=f4e389]: The plain-background CV prompt is the one to use for a resume or job portal. Keep the glasses if you wear them. It is still not an official ID photo.
        - heading "Can I make a passport-size photo with Gemini?" [level=3] [ref=f4e390]
        - paragraph [ref=f4e391]: You can make a white-background, front-facing photo for a CV or a form that accepts one. Official ID photo rules vary by country, so check yours. Do not assume an edited photo will be accepted on a passport, visa, or national ID.
        - heading "What if the office photo changes my shirt?" [level=3] [ref=f4e392]
        - paragraph [ref=f4e393]: The modern office, outdoor and home office prompts are written to keep the clothes. If the shirt still changes, send a follow-up that says "keep the original clothing exactly."
        - heading "What size should a LinkedIn photo be?" [level=3] [ref=f4e394]
        - paragraph [ref=f4e395]: Square crops work well for the profile circle. LinkedIn accepts a large PNG or JPG. A 1:1 result is the simplest starting point.
