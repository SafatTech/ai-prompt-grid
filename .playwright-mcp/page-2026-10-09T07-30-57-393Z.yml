          - listitem [ref=f4e38]: Gemini LinkedIn Profile Picture Prompts for CV & Office Photos
      - heading "Gemini LinkedIn Profile Picture Prompts for CV & Office Photos" [level=1] [ref=f4e39]
      - paragraph [ref=f4e40]: Copy-paste Gemini and ChatGPT prompts to turn a selfie into a professional LinkedIn headshot, a CV or resume photo, or an office portrait.
      - paragraph [ref=f4e41]: Updated October 9, 2026 · AI Prompt Grid editorial
      - generic [ref=f4e42]:
        - paragraph [ref=f4e43]:
          - strong [ref=f4e44]: "Quick answer:"
          - text: A LinkedIn profile picture prompt for Gemini starts with "edit this photo," then names the clothes, the backdrop, and the light, and tells the model to keep the face. The same wording works as a LinkedIn profile picture prompt for ChatGPT. Use a recent, front-facing photo in even light. These looks are for LinkedIn, a CV or resume, a company page, and email. A passport-size version is included for forms that accept one, and official ID rules are called out below.
        - heading "Before you paste" [level=2] [ref=f4e45]
        - list [ref=f4e46]:
          - listitem [ref=f4e47]: Face the camera. Daylight from a window is enough. Skip sunglasses and heavy shadows.
          - listitem [ref=f4e48]: Keep head and shoulders in frame, and crop other people out first.
          - listitem [ref=f4e49]: Change the setting, not the person. Ask for the same face, age, skin tone, beard, glasses, and head covering.
        - heading "Studio headshots" [level=2] [ref=f4e50]
        - heading "1. Navy blazer" [level=3] [ref=f4e51]
        - paragraph [ref=f4e52]: "A straightforward Gemini professional photo prompt: navy blazer, white shirt, light-grey studio. It is a useful professional headshot AI prompt when you want one look that works for men and women."
        - generic [ref=f4e53]:
          - generic [ref=f4e54]:
            - generic [ref=f4e55]: Prompt
            - button "Copy prompt" [ref=f4e56] [cursor=pointer]
          - code [ref=f4e61]: Edit this photo into a professional LinkedIn headshot. Keep the face shape, eyes, nose, lips, hairline, any beard, glasses or head covering, age and exact skin tone. Do not beautify, slim or lighten the skin. Dress them in a well-fitted navy blazer over a plain white shirt, facing the camera, head and shoulders. Soft even light, sharp eyes, light-grey studio backdrop. Square crop. Do not add people, text or logos.
        - generic [ref=f4e62]:
