            - img "Man with wavy hair and a short beard in an untucked white shirt and navy trousers, in a living room with a TV, sofa and plants." [ref=f4e64]
          - figure "After" [ref=f4e66]:
            - img "Man in a navy blazer over a white shirt, light-grey studio." [ref=f4e67]
